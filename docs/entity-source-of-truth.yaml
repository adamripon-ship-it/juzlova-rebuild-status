    potato dumpling mix, hairy dumpling mix (bosáky), gluten-free vanilla
    pudding, Dutch-process cocoa, and vanilla sugar.
  long_description: >-
    Jůzlová is a family food-mix workshop founded in 2004 at Kochánov 40,
    582 53, in the Vysočina region of the Czech Republic, 12 km from
    Havlíčkův Brod. The legal entity is Jůzlová s.r.o., company ID 45900124.
    We supply households, restaurants, canteens and pastry shops across
    Bohemia and Moravia. Wheat flour is KLASA-awarded and milled 12 km away
    in Havlíčkův Brod. There is no self-serve web shop: orders are taken by
    phone or email. The contact page has a live enquiry form.
