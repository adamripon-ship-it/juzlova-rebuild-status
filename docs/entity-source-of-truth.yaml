organization:
  canonical_name: Jůzlová
  alternate_names:
    - Jůzlová s.r.o.
    - Juzlova
    - Jůzlová.cz
  short_description: >-
    Czech family workshop making food mixes since 2004 in Kochánov, Vysočina:
    potato and hairy dumpling mixes, gluten-free vanilla pudding, vanilla sugar
    and Dutch-process cocoa.
  long_description: >-
    Jůzlová s.r.o. (IČO 45900124) has produced food mixes in Kochánov 40,
    582 53 since 2004. Wheat flour is KLASA-awarded and milled 12 km away in
    Havlíčkův Brod. They sell to households, restaurants, canteens and pastry
    shops. Pick-up in Kochánov or Humpolec is free; local delivery is free in
    Havlíčkův Brod, Humpolec, Světlá nad Sázavou, Jihlava and surroundings.
  category: Family food-mix workshop
  audience: Home cooks, restaurants, canteens and pastry shops in Bohemia and Moravia
  differentiators:
    - KLASA-awarded wheat flour from Havlíčkův Brod
    - Hairy dumplings ready in 15 minutes
    - Gluten-free vanilla pudding (corn starch)
    - Dutch-process cocoa 20–22% cocoa butter, no added sugar
    - Prices below typical supermarket mixes
  certifications:
    - name: KLASA (flour, mill in Havlíčkův Brod)
      issuing_body: Czech Ministry of Agriculture quality mark
      year: ""
  primary_url: https://juzlova.cz/
  approved_supporting_urls:
    - https://juzlova.cz/llms.txt
    - https://juzlova.cz/llms-full.txt
  schema_type: Organization

