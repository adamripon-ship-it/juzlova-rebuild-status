  - Review or AggregateRating stars we did not collect
  - Supplier brand names for cocoa (no DeZaan, Olam, ofi)
  - That llms.txt or schema alone will get the brand cited by ChatGPT or Google
  - Wikipedia, Wikidata, or LinkedIn profiles that do not exist yet

