name: Cut over www to GitHub Pages

# Uses CLOUDFLARE_API_TOKEN (Zone:Read + DNS:Edit on juzlova.cz) to point
# www.juzlova.cz at GitHub Pages. The apex already 301s to www.
# Does not print the token. Skips cleanly if the secret is missing.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cutover-pages-dns.yml'

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Point www at GitHub Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set — cannot change DNS."
            exit 1
          fi
          API="https://api.cloudflare.com/client/v4"
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          ZONE_ID=$(curl -fsS "${AUTH[@]}" "${API}/zones?name=juzlova.cz" \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); print(r["result"][0]["id"])')
          echo "Zone ok"
          REC=$(curl -fsS "${AUTH[@]}" "${API}/zones/${ZONE_ID}/dns_records?name=www.juzlova.cz")
          python3 - "$REC" <<'PY'
          import json, sys
          recs = json.loads(sys.argv[1])["result"]
          if not recs:
              print("No www record")
              sys.exit(2)
          r = recs[0]
          print(f"current type={r['type']} content={r['content']} proxied={r['proxied']} id={r['id']}")
          open("/tmp/rec_id", "w").write(r["id"])
          PY
          PAYLOAD='{"type":"CNAME","name":"www","content":"adamripon-ship-it.github.io","proxied":false,"ttl":1}'
          curl -fsS -X PUT "${AUTH[@]}" \
            "${API}/zones/${ZONE_ID}/dns_records/$(cat /tmp/rec_id)" \
            --data "$PAYLOAD" \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); print("updated", r.get("success"), r.get("result",{}).get("content"), "proxied", r.get("result",{}).get("proxied"))'
