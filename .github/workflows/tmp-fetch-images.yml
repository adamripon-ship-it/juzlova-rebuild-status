# TEMPORARY (owner-approved): downloads the owner's Higgsfield-generated images
# listed in tmp-image-fetch/urls.txt and commits them to this branch, because the
# dev sandbox cannot reach the image CDN. Delete before merging.
name: Fetch generated images (temporary)
on:
  push:
    branches: [claude/improvement-suggestions-oflv11]
    paths: [tmp-image-fetch/urls.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -fsSL --retry 3 -o "tmp-image-fetch/$name" "$url"
          done < tmp-image-fetch/urls.txt
          ls -la tmp-image-fetch
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add tmp-image-fetch
          git commit -m "Fetch generated images (temporary)" || exit 0
          git push
