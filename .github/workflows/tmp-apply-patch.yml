name: Temporary - apply site patch

# One-off for branch content-corrections-owner-pdf. Delete after it has run.
on:
  push:
    branches: [content-corrections-owner-pdf]
    paths: ['.github/workflows/tmp-apply-patch.yml']

permissions:
  contents: write
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Fetch and verify patch
        run: |
          gcloud storage cp gs://run-sources-aiapply-ch-europe-west4/tmp-juzlova/corrections.patch.gz /tmp/p.gz
          echo "30a745b5ff747735113d7ce4d2caa3fd1c7c07e685d936a1ea227806c4d3f052  /tmp/p.gz" | sha256sum -c -
      - name: Apply and commit
        run: |
          gunzip -c /tmp/p.gz | git apply --index --binary -
          git config user.name adamripon-ship-it
          git config user.email adam.ripon@surfstr.com
          git commit -m "Remove posting and out-of-area delivery, review translations, responsive fixes" -m "Retire the parcels-abroad page in all languages and the Prague, Brno and export wholesale pages, with 301 redirects. Editor review of en, de and sk against Czech. Layout fixes for phones, laptops and very large screens." -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          git push
