name: Temporary - apply QA patch

# One-off for branch content-corrections-owner-pdf. Delete after it has run.
on:
  push:
    branches: [content-corrections-owner-pdf]
    paths: ['.github/workflows/tmp-apply-qa.yml']

permissions:
  contents: write
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Fetch and verify patch
        run: |
          gcloud storage cp gs://run-sources-aiapply-ch-europe-west4/tmp-juzlova/qa.patch.gz /tmp/p.gz
          echo "0732dd8f0d2179c154d75fa9b353ec5df461d6487f3ab718e4ce409078065b87  /tmp/p.gz" | sha256sum -c -
      - name: Apply and commit
        run: |
          gunzip -c /tmp/p.gz | git apply --index --binary -
          git config user.name adamripon-ship-it
          git config user.email adam.ripon@surfstr.com
          git commit -m "QA: raise small-text contrast and shorten long meta descriptions" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          git push
