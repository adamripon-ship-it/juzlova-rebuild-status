name: Deploy to Google Cloud (europe-west3)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SERVICE: juzlova-web
  REGION: europe-west3

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          missing=""
          [ -z "${{ secrets.GCP_SA_KEY }}" ] && missing="$missing GCP_SA_KEY"
          [ -z "${{ secrets.GCP_PROJECT_ID }}" ] && missing="$missing GCP_PROJECT_ID"
          [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — see MIGRATION.md"
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --region "$REGION" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --allow-unauthenticated \
            --min-instances 0 --max-instances 3 \
            --quiet
          gcloud run services describe "$SERVICE" --region "$REGION" \
            --project "${{ secrets.GCP_PROJECT_ID }}" --format='value(status.url)'

      - name: Verify domain and create domain mappings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: bash scripts/gcp_domain_mapping.sh

      - name: Point Cloudflare DNS at Cloud Run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/cloudflare_dns.sh

      - name: Smoke test
        run: |
          url=$(gcloud run services describe "$SERVICE" --region "$REGION" \
            --project "${{ secrets.GCP_PROJECT_ID }}" --format='value(status.url)')
          curl -fsS -o /dev/null -w "Cloud Run direct: %{http_code}\n" "$url"
