name: Deploy to Google Cloud Storage

# Deploys the static site to a GCS bucket in europe-central2 (Warsaw),
# the Google Cloud region nearest the Czech Republic.
#
# Required repository secrets (see docs/DEPLOY-GCP.md):
#   GCP_SA_KEY      — JSON key of a service account with Storage Admin on the bucket
#   GCP_PROJECT     — the Google Cloud project id
#   GCS_BUCKET      — bucket name (e.g. "juzlova-cz" or "www.juzlova.cz")
#
# SITE_BASE is https://juzlova.cz (owner chose the main build, 2026-08-31).
# This job rebuilds with that domain before every sync so canonicals stay
# on the real host.

# Dispatch-only. This targets a GCS bucket that is not what serves
# www.juzlova.cz — production is the Cloud Run service juzlova-web, deployed by
# deploy-cloudrun.yml. Running on every push made this report a green "Deploy"
# tick while skipping every step, which is how a merged price correction looked
# shipped for an hour while the site still showed the old prices.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check credentials
        id: creds
        run: |
          if [ -n "${{ secrets.GCP_SA_KEY }}" ] && [ -n "${{ secrets.GCS_BUCKET }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "GCP secrets not configured — skipping deploy."
          fi
      - uses: actions/setup-python@v5
        if: steps.creds.outputs.ok == 'true'
        with:
          python-version: '3.12'
      - name: Rebuild with production SITE_BASE
        if: steps.creds.outputs.ok == 'true'
        env:
          SITE_BASE: https://juzlova.cz
        run: python scripts/build_site.py
      - uses: google-github-actions/auth@v2
        if: steps.creds.outputs.ok == 'true'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.creds.outputs.ok == 'true'
      - name: Ensure bucket (europe-central2) and website config
        if: steps.creds.outputs.ok == 'true'
        run: |
          gsutil ls -b "gs://${{ secrets.GCS_BUCKET }}" 2>/dev/null || \
            gsutil mb -p "${{ secrets.GCP_PROJECT }}" -l europe-central2 -b on "gs://${{ secrets.GCS_BUCKET }}"
          gsutil web set -m index.html -e index.html "gs://${{ secrets.GCS_BUCKET }}"
          gsutil iam ch allUsers:objectViewer "gs://${{ secrets.GCS_BUCKET }}"
      - name: Sync site
        if: steps.creds.outputs.ok == 'true'
        run: |
          gsutil -m rsync -r -d \
            -x '^\.git/|^\.github/|^scripts/|^archive/|^brand/|^docs/|^status\.html$|^README\.md$|^Dockerfile$|^nginx\.conf$|^\.gcloudignore$|^\.dockerignore$|^\.gitignore$|^\.nojekyll$' \
            . "gs://${{ secrets.GCS_BUCKET }}"
          echo "Deployed to https://storage.googleapis.com/${{ secrets.GCS_BUCKET }}/index.html"
