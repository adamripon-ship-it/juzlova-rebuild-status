name: Fetch větrníčky photos (one-off)

# One-off helper for PR #36: pulls the three Higgsfield-generated recipe photos,
# converts them to web-sized WebP in img/, rebuilds the site and commits the
# result to this branch. Removed again once the photos are in.

on:
  push:
    branches: [claude/juzlova-czech-desert-recipe-ndr2ai]
    paths: [.github/workflows/fetch-vetrnicky-photos.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/juzlova-czech-desert-recipe-ndr2ai
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - name: Download and convert
        run: |
          B=https://d8j0ntlcm91z4.cloudfront.net/user_3Bj5jSbouMgBXvv0eqo1wQl5cMI
          curl -fsSLo /tmp/v1.png "$B/hf_20260923_224902_c7caf2bb-eb37-4f29-9232-44f29137f02a.png"
          curl -fsSLo /tmp/v2.png "$B/hf_20260923_224903_22cc0eb3-037a-4529-8cd3-739563a8694b.png"
          curl -fsSLo /tmp/v3.png "$B/hf_20260923_224903_98994f00-76b7-469a-9088-e4496fa765d9.png"
          python - <<'EOF'
          from PIL import Image, ImageOps
          for src, name, size in [
              ("/tmp/v1.png", "vetrnicky-s-vanilkovym-kremem.webp", (1020, 680)),
              ("/tmp/v2.png", "vetrnicky-s-vanilkovym-kremem-rez.webp", (900, 600)),
              ("/tmp/v3.png", "vetrnicky-s-vanilkovym-kremem-postup.webp", (900, 600)),
          ]:
              im = ImageOps.fit(Image.open(src).convert("RGB"), size, Image.LANCZOS)
              im.save(f"img/{name}", "WEBP", quality=76, method=6)
              print(name, im.size)
          EOF
      - name: Rebuild and verify
        env:
          SITE_BASE: https://www.juzlova.cz
        run: |
          python scripts/build_site.py
          git checkout -- data/reviews.json
          python scripts/verify_refs.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A img/ .
          git reset -q -- .github/workflows/fetch-vetrnicky-photos.yml
          git commit -m "Add větrníčky recipe photos (hero, cross-section, piping step)"
          git push origin HEAD:claude/juzlova-czech-desert-recipe-ndr2ai
