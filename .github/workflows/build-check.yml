name: Build check

# Guards the committed site against drift. The HTML in the repo root is both
# generated by scripts/build_site.py and committed (GitHub Pages serves it
# directly), so this rebuilds and fails if the committed output is stale, then
# checks that every local reference resolves.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild the site
        env:
          SITE_BASE: https://juzlova.cz
        run: python scripts/build_site.py
      - name: Fail if the committed build is out of date
        run: |
          if ! git diff --quiet; then
            echo "::error::Committed site output is out of sync with scripts/. Run 'python scripts/build_site.py' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi
          echo "Committed build is up to date."
      - name: Verify local references resolve
        run: python scripts/verify_refs.py
