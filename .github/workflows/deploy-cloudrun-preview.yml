name: Cloud Run candidate preview
# Separate service; no production writes, no indexing, no form delivery.
on:
  workflow_dispatch:
concurrency:
  group: discovery-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify candidate
        run: |
          python scripts/build_site.py
          git diff --exit-code
          python scripts/verify_refs.py
          python scripts/verify_sitemaps.py
          python scripts/verify_structured_data.py
          python -m unittest discover -s tests -p 'test_*.py'
          node tests/measurement.test.cjs
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy isolated preview
        env:
          PROJECT: ${{ vars.GCP_PROJECT }}
        run: |
          gcloud run deploy juzlova-discovery-preview --source . --project "$PROJECT" \
            --region europe-west4 --allow-unauthenticated \
            --update-env-vars "PREVIEW_READ_ONLY=1,SITE_REVISION=$GITHUB_SHA" --quiet
          url=$(gcloud run services describe juzlova-discovery-preview --project "$PROJECT" --region europe-west4 --format='value(status.url)')
          python scripts/smoke_discovery.py --preview --base "$url" --expected-revision "$GITHUB_SHA"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
