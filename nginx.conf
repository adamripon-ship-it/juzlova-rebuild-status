server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    error_page 404 /index.html;
}
