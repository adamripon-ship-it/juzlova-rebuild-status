server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Clean URLs: /recepty and /en/recepty -> .../index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
    }
    location /img/ {
        add_header Cache-Control "public, max-age=604800";
    }
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=300";
    }

    # Defence in depth — these trees are also left out of the image.
    location /archive/ { return 404; }
    location /scripts/ { return 404; }
    location /.git/ { return 404; }
    location /.github/ { return 404; }

    gzip on;
    # text/html is always gzipped by nginx, so listing it here only produces a
    # "duplicate MIME type" warning at startup — omit it.
    gzip_types text/css application/javascript image/svg+xml application/json text/xml application/xml text/plain;
}
