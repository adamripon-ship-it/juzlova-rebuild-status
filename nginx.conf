log_format llms_hit '$time_iso8601 ua="$http_user_agent" uri=$request_uri';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Relative Location headers: behind Cloud Run's TLS termination nginx only sees
    # http on 8080, so an absolute redirect would point at http://host:8080/.
    absolute_redirect off;

    # Security and charset headers (repeated in locations that set their own headers,
    # because nginx add_header is not inherited once a block adds any header).
    charset utf-8;
    charset_types text/css application/javascript application/json text/xml application/xml text/plain image/svg+xml;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # One hostname: apex → www (Cloud Run keeps the request Host).
    if ($http_host ~* ^juzlova\.cz(?::\d+)?$) {
        return 301 https://www.juzlova.cz$request_uri;
    }

    # Ratings + contact API (Python in this container).
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent $http_user_agent;
        proxy_read_timeout 20s;
    }

    location = /llms.txt {
        default_type text/plain;
        access_log /dev/stdout llms_hit;
        mirror /internal-llms-log;
        try_files /llms.txt =404;
    }
    location = /llms-full.txt {
        default_type text/plain;
        access_log /dev/stdout llms_hit;
        mirror /internal-llms-log;
        try_files /llms-full.txt =404;
    }
    location = /internal-llms-log {
        internal;
        proxy_pass http://127.0.0.1:8090/api/llms-log;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header User-Agent $http_user_agent;
    }

    # Retired product photos (the sugar photo showed sachets; the workshop sells kilo bags only).
    location = /img/vanilkovy-cukr.webp { return 301 /img/vanilkovy-cukr-kilo.webp; }
    location = /img/vanilkovy-cukr.png { return 301 /img/vanilkovy-cukr-kilo.webp; }
    location = /img/vanilkovy-cukr-pytliky.webp { return 301 /img/vanilkovy-cukr-kilo.webp; }
    location = /img/vanilkovy-cukr-pytliky.png { return 301 /img/vanilkovy-cukr-kilo.webp; }

    # Old URLs -> new localized URLs, generated by scripts/build_site.py.
    include /etc/nginx/juzlova-redirects.conf;

    # Clean URLs: /recepty and /en/recepty -> .../index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location /assets/fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location /img/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Defence in depth — these trees are also left out of the image.
    location /archive/ { return 404; }
    location /scripts/ { return 404; }
    location /server/ { return 404; }
    location /data/ { return 404; }
    location /.git/ { return 404; }
    location /.github/ { return 404; }
    location = /redirects.conf { return 404; }
    location = /Dockerfile { return 404; }
    location = /nginx.conf { return 404; }

    gzip on;
    # text/html is always gzipped by nginx, so listing it here only produces a
    # "duplicate MIME type" warning at startup — omit it.
    gzip_types text/css application/javascript image/svg+xml application/json text/xml application/xml text/plain font/woff2;
}
