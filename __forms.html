<!DOCTYPE html>
<html lang="cs">
<head><meta charset="utf-8"><title>forms</title></head>
<body>
<form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="contact">
  <input type="hidden" name="lang" value="cs">
  <input type="hidden" name="subject" value="Jůzlová — poptávka z webu">
  <input type="text" name="bot-field">
  <input type="text" name="name">
  <input type="tel" name="phone">
  <input type="email" name="email">
  <input type="checkbox" name="product" value="bramborove_knedliky">
<input type="checkbox" name="product" value="chlupate_knedliky">
<input type="checkbox" name="product" value="vanilkovy_pudink">
<input type="checkbox" name="product" value="kakao_holandskeho_typu">
<input type="checkbox" name="product" value="vanilkovy_cukr">

  <input type="text" name="products">
  <textarea name="message"></textarea>
</form>
</body>
</html>
